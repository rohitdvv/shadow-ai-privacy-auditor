name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Offline guarantee
        run: npm run verify:offline

      - name: Detection test suite
        run: npm test

      - name: Extension bundle builds and smoke-tests
        run: npm run build:extension

      - name: Bundle is up to date with engine/
        run: |
          git diff --exit-code -- extension/vendor/engine.bundle.js \
            || (echo "::error::extension/vendor/engine.bundle.js is stale — run 'npm run build:extension' and commit the result." && exit 1)

      - name: Validate extension manifest
        run: node -e "const m=require('./extension/manifest.json');if(m.manifest_version!==3)throw new Error('expected MV3');if(m.host_permissions.length)throw new Error('extension must request no host permissions');console.log('manifest ok:',m.name,m.version)"
