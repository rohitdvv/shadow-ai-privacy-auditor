name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs so a moved or hijacked tag cannot
      # inject code into the build. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Offline guarantee
        run: npm run verify:offline

      - name: Detection + security test suites
        run: npm test

      - name: Extension bundle builds and smoke-tests
        run: npm run build:extension

      - name: Bundle is up to date with engine/
        run: |
          git diff --exit-code -- extension/vendor/engine.bundle.js \
            || (echo "::error::extension/vendor/engine.bundle.js is stale — run 'npm run build:extension' and commit the result." && exit 1)

      # Block scalar: the script contains ": ", which is invalid in a plain YAML value.
      - name: Validate extension manifest
        run: |
          node -e "
            const m = require('./extension/manifest.json');
            if (m.manifest_version !== 3) throw new Error('expected MV3');
            if (m.host_permissions.length) throw new Error('extension must request no host permissions');
            if (m.description.length > 132) throw new Error('description exceeds the Chrome Web Store 132-char limit: ' + m.description.length);
            console.log('manifest ok:', m.name, m.version, '· description', m.description.length + '/132');
          "
