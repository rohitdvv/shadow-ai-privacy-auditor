name: Shadow AI CodeQL config

# Excluded on purpose — everything shipped stays in scope:
#  - extension/vendor/: generated by tools/build-extension.mjs as a flattening of
#    engine/*.js, which IS scanned; alerts there only duplicate engine/ alerts.
#  - tests/security.js: holds deliberately catastrophic regex strings that the
#    tests prove are rejected before they are ever compiled.
paths-ignore:
  - extension/vendor/**
  - tests/security.js
